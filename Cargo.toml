[workspace]
resolver = "3"
members = ["crates/writ-policy", "crates/writ-recorder", "crates/writ-proxy", "crates/writ-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
writ-policy = { path = "crates/writ-policy" }
writ-recorder = { path = "crates/writ-recorder" }
writ-proxy = { path = "crates/writ-proxy" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
humantime = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"

[workspace]
resolver = "3"
members = ["crates/writ-policy", "crates/writ-recorder", "crates/writ-daemon", "crates/writ-proxy", "crates/writ-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
writ-policy = { path = "crates/writ-policy" }
writ-recorder = { path = "crates/writ-recorder" }
writ-daemon = { path = "crates/writ-daemon" }
writ-proxy = { path = "crates/writ-proxy" }
anyhow = "1"
biscuit-auth = { version = "6", default-features = false, features = ["datalog-macro"] }
clap = { version = "4.6", features = ["derive"] }
humantime = "2.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
signal-hook = "0.4"
tempfile = "3"
thiserror = "2"
